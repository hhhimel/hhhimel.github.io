<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>himu.dev — personal knowledge base</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:wght@400;700&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f5;--surface:#ffffff;--raised:#f1f0ec;--border:#e2e0d8;--border-strong:#c8c6bc;
  --ink:#1a1916;--muted:#6b6860;--hint:#a09e97;
  --accent:#1a1916;--accent-inv:#f9f8f5;
  --tag-search-bg:#deeaf8;--tag-search-txt:#0c3d6e;
  --tag-learn-bg:#d4f0e4;--tag-learn-txt:#084f38;
  --tag-fix-bg:#fde9c4;--tag-fix-txt:#5c3407;
  --tag-about-bg:#e8e5fc;--tag-about-txt:#352080;
  --mono:'Berkeley Mono',monospace;
  --serif:'Newsreader',serif;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
}
[data-theme="dark"]{
  --bg:#111110;--surface:#1a1917;--raised:#222220;--border:#2e2c28;--border-strong:#3e3c38;
  --ink:#f0ede8;--muted:#8c8a84;--hint:#504e4a;
  --accent:#f0ede8;--accent-inv:#111110;
  --tag-search-bg:#0d2540;--tag-search-txt:#93c5ef;
  --tag-learn-bg:#0a2b1e;--tag-learn-txt:#6bcfa5;
  --tag-fix-bg:#2e1d06;--tag-fix-txt:#f0b864;
  --tag-about-bg:#1e1840;--tag-about-txt:#b5abf5;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--mono);background:var(--bg);color:var(--ink);min-height:100vh;transition:background .2s,color .2s}

/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:0 1.5rem}
.topbar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:1rem;height:52px}
.logo{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;flex-shrink:0;text-decoration:none}
.logo span{color:var(--muted);font-weight:400}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:none;padding:6px 10px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-tab:hover{color:var(--ink);background:var(--raised)}
.nav-tab.active{color:var(--ink);background:var(--raised);font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;cursor:pointer;color:var(--muted);font-size:13px;transition:all .15s;display:flex;align-items:center;gap:4px;font-family:var(--mono)}
.icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.main{flex:1;max-width:960px;margin:0 auto;padding:2rem 1.5rem;width:100%}

/* SEARCH BAR */
.search-bar-wrap{position:relative;margin-bottom:1.5rem}
.search-input{width:100%;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 16px 10px 38px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--border-strong)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-results-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);z-index:50;max-height:300px;overflow-y:auto;box-shadow:var(--shadow)}
.search-result-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--raised)}
.search-result-title{font-size:13px;color:var(--ink);margin-bottom:2px}
.search-result-meta{font-size:11px;color:var(--muted)}

/* WEB SEARCH */
.websearch-bar{display:flex;gap:8px;margin-bottom:1rem}
.websearch-input{flex:1;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;outline:none;transition:border-color .15s}
.websearch-input:focus{border-color:var(--border-strong)}
.websearch-btn{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:9px 16px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.websearch-btn:hover{opacity:.8}
.web-results{margin-top:1rem}
.web-result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .15s}
.web-result-card:hover{border-color:var(--border-strong)}
.web-result-title{font-size:14px;color:var(--tag-search-txt);margin-bottom:4px;text-decoration:underline}
.web-result-url{font-size:10px;color:var(--muted);margin-bottom:6px;word-break:break-all}
.web-result-snippet{font-size:12px;color:var(--muted);line-height:1.6}
.web-result-save{font-size:11px;color:var(--muted);background:var(--raised);border:1px solid var(--border);border-radius:var(--radius);padding:3px 10px;cursor:pointer;margin-top:8px;font-family:var(--mono);transition:all .15s}
.web-result-save:hover{color:var(--ink);border-color:var(--border-strong)}

/* FILTER TAGS */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
.filter-label{font-size:11px;color:var(--hint);margin-right:4px}
.tag-pill{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:99px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--surface);color:var(--muted)}
.tag-pill:hover{border-color:var(--border-strong);color:var(--ink)}
.tag-pill.active{background:var(--ink);color:var(--accent-inv);border-color:var(--ink)}
.tag-pill.t-search{background:var(--tag-search-bg);color:var(--tag-search-txt);border-color:var(--tag-search-bg)}
.tag-pill.t-learn{background:var(--tag-learn-bg);color:var(--tag-learn-txt);border-color:var(--tag-learn-bg)}
.tag-pill.t-fix{background:var(--tag-fix-bg);color:var(--tag-fix-txt);border-color:var(--tag-fix-bg)}
.hashtag{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:var(--mono);transition:all .15s}
.hashtag:hover{color:var(--ink);border-color:var(--border-strong)}
.hashtag.active{background:var(--border-strong);color:var(--ink)}

/* POSTS */
.post-item{display:flex;gap:1rem;padding:1.1rem 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s}
.post-item:first-child{border-top:1px solid var(--border)}
.post-item:hover{opacity:.7}
.post-date-col{flex-shrink:0;width:86px;padding-top:2px}
.post-date{font-size:11px;color:var(--hint)}
.post-body-col{flex:1;min-width:0}
.post-type-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;margin-bottom:5px}
.post-title{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);line-height:1.4;margin-bottom:3px}
.post-excerpt{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.post-tags-row{display:flex;gap:4px;flex-wrap:wrap}
.post-tag-chip{font-size:10px;color:var(--hint);background:var(--raised);border-radius:99px;padding:1px 7px}

/* SINGLE POST */
.single-wrap{max-width:680px}
.back-btn{font-size:12px;color:var(--muted);background:none;border:none;padding:0;cursor:pointer;font-family:var(--mono);display:flex;align-items:center;gap:5px;margin-bottom:2rem;transition:color .15s}
.back-btn:hover{color:var(--ink)}
.sp-type{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;margin-bottom:.75rem}
.sp-title{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--ink);line-height:1.25;margin-bottom:.5rem}
.sp-meta{font-size:11px;color:var(--hint);margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap}
.sp-body{font-size:14px;color:var(--ink);line-height:1.9}
.sp-body p{margin-bottom:1rem}
.sp-body h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:1.5rem 0 .5rem}
.sp-body code{font-family:var(--mono);font-size:12px;background:var(--raised);padding:2px 6px;border-radius:4px}
.sp-body pre{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;font-size:12px;overflow-x:auto;margin:1rem 0;font-family:var(--mono);line-height:1.6}
.sp-tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
/* COMMENTS */
.comments-section{margin-top:2.5rem;border-top:1px solid var(--border);padding-top:1.5rem}
.comments-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:1rem}
.comment-item{background:var(--raised);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem}
.comment-author{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
.comment-text{font-size:12px;color:var(--muted);line-height:1.6}
.comment-time{font-size:10px;color:var(--hint);margin-top:4px}
.comment-form{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}
.comment-input,.comment-textarea{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;outline:none;transition:border-color .15s}
.comment-input:focus,.comment-textarea:focus{border-color:var(--border-strong)}
.comment-textarea{min-height:70px;resize:vertical}
.comment-submit{align-self:flex-start;font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:7px 16px;cursor:pointer;transition:opacity .15s}
.comment-submit:hover{opacity:.8}

/* NEW POST */
.form-section-title{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--ink);margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:.5px}
.form-input,.form-textarea,.form-select{width:100%;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;outline:none;transition:border-color .15s}
.form-textarea{min-height:140px;resize:vertical;line-height:1.7}
.form-select{appearance:none;cursor:pointer}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--border-strong)}
.form-row{display:flex;gap:.75rem;flex-wrap:wrap}
.form-row .form-group{flex:1;min-width:180px}
.submit-btn{font-family:var(--mono);font-size:13px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:10px 22px;cursor:pointer;transition:opacity .15s}
.submit-btn:hover{opacity:.8}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem}
@media(max-width:600px){.about-grid{grid-template-columns:1fr}}
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.about-card-title{font-size:11px;color:var(--muted);margin-bottom:.75rem;letter-spacing:.5px}
.stat-row{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:.5rem}
.stat-item{display:flex;flex-direction:column}
.stat-n{font-size:26px;font-weight:700;color:var(--ink)}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* NOTEPAD */
.notepad-wrap{max-width:680px}
.notepad-toolbar{display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.notepad-textarea{width:100%;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;outline:none;min-height:420px;resize:vertical;line-height:1.8;transition:border-color .15s}
.notepad-textarea:focus{border-color:var(--border-strong)}
.notepad-status{font-size:11px;color:var(--hint);margin-top:.5rem}
.note-save-btn{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:7px 14px;cursor:pointer;transition:opacity .15s}
.note-save-btn:hover{opacity:.8}
.note-clear-btn{font-family:var(--mono);font-size:12px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;cursor:pointer;transition:all .15s}
.note-clear-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.saved-notes{margin-top:1.5rem}
.saved-note-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.75rem}
.saved-note-content{flex:1;font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap;cursor:pointer}
.saved-note-content:hover{color:var(--ink)}
.saved-note-time{font-size:10px;color:var(--hint);flex-shrink:0}
.note-del{background:none;border:none;color:var(--hint);cursor:pointer;font-size:13px;padding:0;transition:color .15s;flex-shrink:0}
.note-del:hover{color:#c0392b}

/* CALCULATOR */
.calc-wrap{max-width:340px}
.calc-display{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem;text-align:right}
.calc-expr{font-size:12px;color:var(--muted);min-height:18px;font-family:var(--mono)}
.calc-result{font-size:28px;font-weight:700;color:var(--ink);font-family:var(--mono);word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-btn{font-family:var(--mono);font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;cursor:pointer;transition:all .12s;color:var(--ink)}
.calc-btn:hover{background:var(--raised);border-color:var(--border-strong)}
.calc-btn:active{transform:scale(.96)}
.calc-btn.op{color:var(--tag-search-txt);background:var(--tag-search-bg)}
.calc-btn.eq{background:var(--ink);color:var(--accent-inv);border-color:var(--ink)}
.calc-btn.ac{color:#c0392b}
.calc-history{margin-top:1rem;max-height:160px;overflow-y:auto}
.calc-history-item{font-size:11px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);font-family:var(--mono)}

/* WEATHER */
.weather-wrap{max-width:460px}
.weather-search-row{display:flex;gap:8px;margin-bottom:1.25rem}
.weather-input{flex:1;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;outline:none;transition:border-color .15s}
.weather-input:focus{border-color:var(--border-strong)}
.weather-btn{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:9px 16px;cursor:pointer;transition:opacity .15s}
.weather-btn:hover{opacity:.8}
.weather-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:.75rem}
.weather-city{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.weather-temp{font-size:48px;font-weight:300;font-family:var(--serif);color:var(--ink);line-height:1;margin-bottom:.5rem}
.weather-desc{font-size:13px;color:var(--muted);margin-bottom:1rem;text-transform:capitalize}
.weather-details{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.weather-detail{display:flex;flex-direction:column}
.weather-detail-val{font-size:14px;font-weight:700;color:var(--ink)}
.weather-detail-lbl{font-size:10px;color:var(--hint);margin-top:2px}
.weather-note{font-size:11px;color:var(--hint);margin-top:.75rem}

/* NEWS */
.news-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.news-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .15s}
.news-card:hover{border-color:var(--border-strong)}
.news-source{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.news-title{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);line-height:1.4;margin-bottom:4px}
.news-time{font-size:10px;color:var(--hint)}
.news-save-btn{font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:var(--radius);padding:2px 8px;cursor:pointer;font-family:var(--mono);margin-top:8px;transition:all .15s}
.news-save-btn:hover{color:var(--ink);border-color:var(--border-strong)}

/* MESSAGING */
.msg-wrap{display:flex;flex-direction:column;height:540px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.msg-header{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.msg-status{width:7px;height:7px;background:#2ecc71;border-radius:50%;flex-shrink:0}
.msg-list{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.msg-item{max-width:75%}
.msg-item.me{align-self:flex-end}
.msg-item.them{align-self:flex-start}
.msg-bubble{padding:.6rem .9rem;border-radius:12px;font-size:13px;line-height:1.5}
.msg-item.me .msg-bubble{background:var(--ink);color:var(--accent-inv);border-bottom-right-radius:3px}
.msg-item.them .msg-bubble{background:var(--raised);color:var(--ink);border-bottom-left-radius:3px}
.msg-time{font-size:10px;color:var(--hint);margin-top:3px;text-align:right}
.msg-item.them .msg-time{text-align:left}
.msg-author{font-size:10px;color:var(--muted);margin-bottom:3px}
.msg-input-row{border-top:1px solid var(--border);padding:.75rem 1rem;display:flex;gap:8px;align-items:flex-end}
.msg-input{flex:1;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--raised);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;resize:none;max-height:80px;line-height:1.5;transition:border-color .15s}
.msg-input:focus{border-color:var(--border-strong)}
.msg-send{background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:9px 14px;cursor:pointer;font-family:var(--mono);font-size:12px;transition:opacity .15s;white-space:nowrap}
.msg-send:hover{opacity:.8}
.msg-name-setup{padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;align-items:flex-start}
.msg-name-input{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--raised);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none}
.msg-name-btn{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--accent-inv);border:none;border-radius:var(--radius);padding:8px 16px;cursor:pointer}

/* SECTION TITLES */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.section-title{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--ink)}
.section-actions{display:flex;gap:8px}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:var(--accent-inv);font-family:var(--mono);font-size:12px;padding:.6rem 1rem;border-radius:var(--radius);opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--hint);font-size:13px}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-left:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" onclick="navigate('feed')">himu<span>.dev</span></a>
      <nav class="nav-tabs">
        <button class="nav-tab active" id="tab-feed" onclick="navigate('feed')">feed</button>
        <button class="nav-tab" id="tab-websearch" onclick="navigate('websearch')">web search</button>
        <button class="nav-tab" id="tab-notepad" onclick="navigate('notepad')">notepad</button>
        <button class="nav-tab" id="tab-calc" onclick="navigate('calc')">calculator</button>
        <button class="nav-tab" id="tab-weather" onclick="navigate('weather')">weather</button>
        <button class="nav-tab" id="tab-news" onclick="navigate('news')">news</button>
        <button class="nav-tab" id="tab-msg" onclick="navigate('msg')">messages</button>
        <button class="nav-tab" id="tab-about" onclick="navigate('about')">about</button>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">◑</button>
        <button class="icon-btn" onclick="navigate('new')" title="New post">+ post</button>
      </div>
    </div>
  </header>

  <main class="main" id="main-content"></main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA STORE ──────────────────────────────────────────────
const STORAGE_KEY = 'himu_blog_v2';
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData(); }
  catch { return defaultData(); }
}
function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch{} }
function defaultData() {
  return {
    posts: [
      { id: 1, type:'fix', date:'2025-12-04', title:'Fixed: nginx 502 bad gateway after Docker restart', excerpt:'Upstream kept failing — turned out to be a DNS resolution issue inside the container network.', tags:['#nginx','#docker','#devops'], content:`After restarting Docker, nginx kept returning a 502. The upstream service was running fine but nginx couldn't resolve the hostname.\n\n<h3>The problem</h3>\nDocker assigns new IPs on restart. nginx caches the DNS at startup — so the old IP was stale.\n\n<h3>The fix</h3>\nAdd a resolver directive with Docker's internal DNS:\n\n<pre>resolver 127.0.0.11 valid=10s;\nset $upstream http://api:3000;\nproxy_pass $upstream;</pre>\n\nThe <code>set</code> trick forces nginx to re-resolve on every request instead of caching at startup.`, comments:[] },
      { id: 2, type:'learn', date:'2025-11-18', title:'Understanding CSS cascade layers (@layer)', excerpt:'Finally wrapped my head around why @layer exists and when it actually helps.', tags:['#css','#frontend'], content:`CSS <code>@layer</code> lets you control specificity at scale without fighting selector wars.\n\n<h3>Basic idea</h3>\nYou declare layers in order, and later layers win — regardless of specificity inside them.\n\n<pre>@layer base, components, utilities;</pre>\n\n<h3>When it helps</h3>\nMassively useful when integrating third-party styles. Put the library in a low-priority layer and your overrides always win.\n\n<pre>@layer vendor {\n  /* third party CSS here */\n}\n\n@layer app {\n  /* your styles win automatically */\n}</pre>`, comments:[] },
      { id: 3, type:'search', date:'2025-11-02', title:'How to run a cron job inside a Docker container', excerpt:'Searched this three times. Writing it down properly this time.', tags:['#docker','#linux','#cron'], content:`Every few months I need to do this and forget. Here's the definitive version.\n\n<pre>FROM ubuntu:22.04\nRUN apt-get update && apt-get install -y cron\nCOPY crontab /etc/cron.d/mycron\nRUN chmod 0644 /etc/cron.d/mycron\nRUN crontab /etc/cron.d/mycron\nCMD cron -f</pre>\n\n<h3>The crontab file</h3>\n<pre>* * * * * root /script.sh >> /proc/1/fd/1 2>&1</pre>\n\nThe <code>/proc/1/fd/1</code> trick routes output to Docker's log stream.`, comments:[] },
      { id: 4, type:'learn', date:'2025-10-15', title:'Git rebase vs merge — the mental model that clicked', excerpt:'I used to always merge. Here is the model that made rebase make sense.', tags:['#git'], content:`<h3>Merge preserves history</h3>\nA merge commit shows that two branches were combined. Good for landing feature branches.\n\n<h3>Rebase rewrites history</h3>\nMoves your commits on top of the target. Makes the log linear.\n\n<pre>git rebase main  # replay my commits on top of main</pre>\n\n<h3>My rule</h3>\nRebase for keeping a local feature branch up to date. Merge for the final integration. Never rebase a branch others are working on.`, comments:[] },
      { id: 5, type:'fix', date:'2025-09-28', title:'Fixed: Python venv not activating on Windows WSL', excerpt:'The activate script was there but doing nothing. Permissions issue.', tags:['#python','#wsl','#linux'], content:`Created a venv inside WSL but <code>source venv/bin/activate</code> had no effect.\n\n<h3>Root cause</h3>\nThe venv was created on a Windows-mounted path (<code>/mnt/c/...</code>). WSL has permission issues with Windows filesystems for executable scripts.\n\n<h3>Fix</h3>\n<pre>cd ~/projects/myproject\npython3 -m venv venv\nsource venv/bin/activate</pre>\n\nAlways keep Python projects under <code>~/</code> in WSL, not under <code>/mnt/c/</code>.`, comments:[] }
    ],
    notes: [],
    calcHistory: [],
    messages: [
      { id:1, author:'himu', text:'Hey, this is the messages tab. You can chat here with anyone who visits your site!', time: new Date().toISOString(), me: true },
      { id:2, author:'visitor', text:'Nice blog! The nginx fix saved me an hour.', time: new Date().toISOString(), me: false }
    ],
    savedNews:[],
    userName: null
  };
}

let DB = loadData();
let currentView = 'feed';
let activeFilter = 'all';
let activeTag = null;
let searchQuery = '';
let singlePostId = null;
let calcExpr = '';
let calcDisplay = '0';

// ── NAVIGATION ───────────────────────────────────────────────
function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + (view === 'new' || view === 'single' ? 'feed' : view));
  if(tab) tab.classList.add('active');
  render();
}

function render() {
  const el = document.getElementById('main-content');
  if(currentView === 'feed') el.innerHTML = renderFeed();
  else if(currentView === 'new') el.innerHTML = renderNewPost();
  else if(currentView === 'single') el.innerHTML = renderSingle();
  else if(currentView === 'websearch') el.innerHTML = renderWebSearch();
  else if(currentView === 'notepad') el.innerHTML = renderNotepad();
  else if(currentView === 'calc') el.innerHTML = renderCalc();
  else if(currentView === 'weather') el.innerHTML = renderWeather();
  else if(currentView === 'news') el.innerHTML = renderNews();
  else if(currentView === 'msg') el.innerHTML = renderMsg();
  else if(currentView === 'about') el.innerHTML = renderAbout();
  afterRender();
}

function afterRender() {
  if(currentView === 'notepad') {
    const ta = document.getElementById('notepad-area');
    if(ta) { ta.value = window._notepadDraft || ''; updateNoteCount(); }
  }
  if(currentView === 'msg') scrollMsgList();
  if(currentView === 'weather' && window._lastWeatherCity) fetchWeather(window._lastWeatherCity, false);
}

// ── UTILS ────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function formatDate(d) {
  const [y,m,day] = d.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+parseInt(day)+', '+y;
}
function tagClass(t){return{search:'tag-search',learn:'tag-learn',fix:'tag-fix'}[t]||'tag-search'}
function tagLabel(t){return{search:'search log',learn:'learning note',fix:'fix guide'}[t]||t}
function renderContent(raw){
  return raw.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>')
    .split('\n').map(l=>l.startsWith('<')?l:`<p>${l}</p>`).join('');
}
function allTags(){
  const s=new Set();
  DB.posts.forEach(p=>(p.tags||[]).forEach(t=>s.add(t)));
  return [...s].sort();
}
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-btn').textContent=dark?'◑':'◐';
}
function exportMD(p){
  const md=`# ${p.title}\n\n**Date:** ${formatDate(p.date)}  \n**Type:** ${tagLabel(p.type)}  \n**Tags:** ${(p.tags||[]).join(', ')}\n\n---\n\n${p.excerpt}\n\n${p.content.replace(/<[^>]+>/g,'')}`;
  const a=document.createElement('a');
  a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(md);
  a.download=p.title.replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.md';
  a.click(); toast('Exported as markdown!');
}
function exportAllMD(){
  const md=DB.posts.map(p=>`# ${p.title}\n\n**Date:** ${formatDate(p.date)} | **Type:** ${tagLabel(p.type)} | **Tags:** ${(p.tags||[]).join(', ')}\n\n${p.excerpt}\n\n${p.content.replace(/<[^>]+>/g,'')}\n\n---\n`).join('\n');
  const a=document.createElement('a');
  a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(md);
  a.download='himu-blog-export.md'; a.click(); toast('All posts exported!');
}

// ── FEED ─────────────────────────────────────────────────────
function renderFeed(){
  const tags = allTags();
  const filtered = DB.posts.filter(p => {
    const matchType = activeFilter==='all' || p.type===activeFilter;
    const matchTag = !activeTag || (p.tags||[]).includes(activeTag);
    const matchSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.excerpt.toLowerCase().includes(searchQuery.toLowerCase());
    return matchType && matchTag && matchSearch;
  });
  return `
  <div class="section-header">
    <div class="section-title">Knowledge feed</div>
    <div class="section-actions">
      <button class="icon-btn" onclick="exportAllMD()">⬇ export all</button>
    </div>
  </div>
  <div class="search-bar-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="feed-search" placeholder="Search posts..." value="${searchQuery}" oninput="onFeedSearch(this.value)" />
  </div>
  <div class="filter-row">
    <span class="filter-label">type:</span>
    <button class="tag-pill${activeFilter==='all'?' active':''}" onclick="setFilter('all')">all</button>
    <button class="tag-pill${activeFilter==='search'?' t-search':''}" onclick="setFilter('search')">search logs</button>
    <button class="tag-pill${activeFilter==='learn'?' t-learn':''}" onclick="setFilter('learn')">learning</button>
    <button class="tag-pill${activeFilter==='fix'?' t-fix':''}" onclick="setFilter('fix')">fix guides</button>
  </div>
  ${tags.length ? `<div class="filter-row"><span class="filter-label">tags:</span>${tags.map(t=>`<button class="hashtag${activeTag===t?' active':''}" onclick="setTag('${t}')">${t}</button>`).join('')}</div>` : ''}
  <div id="posts-list">
    ${filtered.length ? filtered.map(p=>`
    <div class="post-item" onclick="openPost(${p.id})">
      <div class="post-date-col"><div class="post-date">${formatDate(p.date)}</div></div>
      <div class="post-body-col">
        <span class="post-type-badge ${tagClass(p.type)}">${tagLabel(p.type)}</span>
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
        <div class="post-tags-row">${(p.tags||[]).map(t=>`<span class="post-tag-chip">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('') : '<div class="empty-state">No posts found.</div>'}
  </div>`;
}
function onFeedSearch(v){ searchQuery=v; document.getElementById('posts-list').innerHTML = renderFeed().split('id="posts-list">')[1].split('</div>\n  </div>')[0]; render(); }
function setFilter(f){ activeFilter=f; render(); }
function setTag(t){ activeTag=activeTag===t?null:t; render(); }
function openPost(id){ singlePostId=id; navigate('single'); }

// ── SINGLE POST ───────────────────────────────────────────────
function renderSingle(){
  const p = DB.posts.find(x=>x.id===singlePostId);
  if(!p) return '<div class="empty-state">Post not found.</div>';
  return `
  <div class="single-wrap">
    <button class="back-btn" onclick="navigate('feed')">← back to feed</button>
    <span class="sp-type ${tagClass(p.type)}">${tagLabel(p.type)}</span>
    <div class="sp-title">${p.title}</div>
    <div class="sp-meta">
      <span>${formatDate(p.date)}</span>
      ${(p.tags||[]).map(t=>`<span>${t}</span>`).join('')}
    </div>
    <div class="sp-tags-row">${(p.tags||[]).map(t=>`<button class="hashtag" onclick="setTag('${t}');navigate('feed')">${t}</button>`).join('')}</div>
    <div class="sp-body">${renderContent(p.content)}</div>
    <div style="margin-top:1.5rem;display:flex;gap:8px;flex-wrap:wrap">
      <button class="icon-btn" onclick="exportMD(DB.posts.find(x=>x.id==${p.id}))">⬇ export .md</button>
      <button class="icon-btn" onclick="deletePost(${p.id})">✕ delete</button>
    </div>
    <div class="comments-section">
      <div class="comments-title">Comments (${(p.comments||[]).length})</div>
      ${(p.comments||[]).map(c=>`
      <div class="comment-item">
        <div class="comment-author">${c.author}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${new Date(c.time).toLocaleString()}</div>
      </div>`).join('')}
      <div class="comment-form">
        <input class="comment-input" id="c-name" placeholder="Your name" />
        <textarea class="comment-textarea" id="c-text" placeholder="Write a comment..."></textarea>
        <button class="comment-submit" onclick="addComment(${p.id})">post comment</button>
      </div>
    </div>
  </div>`;
}
function addComment(id){
  const p=DB.posts.find(x=>x.id===id); if(!p) return;
  const name=document.getElementById('c-name').value.trim();
  const text=document.getElementById('c-text').value.trim();
  if(!name||!text){toast('Name and comment required');return;}
  p.comments=p.comments||[];
  p.comments.push({author:name,text,time:new Date().toISOString()});
  saveData(); singlePostId=id; render(); toast('Comment added!');
}
function deletePost(id){
  if(!confirm('Delete this post?')) return;
  DB.posts=DB.posts.filter(x=>x.id!==id);
  saveData(); navigate('feed'); toast('Post deleted.');
}

// ── NEW POST ─────────────────────────────────────────────────
function renderNewPost(){
  return `
  <button class="back-btn" onclick="navigate('feed')">← back to feed</button>
  <div class="form-section-title">Write a new post</div>
  <div class="form-row">
    <div class="form-group" style="flex:2">
      <label class="form-label">title</label>
      <input class="form-input" id="np-title" placeholder="What did you search, learn, or fix?" />
    </div>
    <div class="form-group" style="flex:1">
      <label class="form-label">category</label>
      <select class="form-select" id="np-type">
        <option value="search">search log</option>
        <option value="learn">learning note</option>
        <option value="fix">fix guide</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">excerpt</label>
    <input class="form-input" id="np-excerpt" placeholder="One-line summary..." />
  </div>
  <div class="form-group">
    <label class="form-label">tags (comma separated, e.g. #python, #linux)</label>
    <input class="form-input" id="np-tags" placeholder="#python, #linux, #fix" />
  </div>
  <div class="form-group">
    <label class="form-label">content (use \`\`\` for code blocks, &lt;h3&gt; for headings)</label>
    <textarea class="form-textarea" id="np-content" placeholder="Write your notes here..."></textarea>
  </div>
  <button class="submit-btn" onclick="addPost()">publish post</button>`;
}
function addPost(){
  const title=document.getElementById('np-title').value.trim();
  if(!title){toast('Title is required');return;}
  const tagsRaw=document.getElementById('np-tags').value;
  const tags=tagsRaw.split(',').map(t=>t.trim()).filter(t=>t).map(t=>t.startsWith('#')?t:'#'+t);
  DB.posts.unshift({
    id:Date.now(), type:document.getElementById('np-type').value,
    date:new Date().toISOString().split('T')[0],
    title, excerpt:document.getElementById('np-excerpt').value.trim()||'...',
    tags, content:document.getElementById('np-content').value.trim()||title, comments:[]
  });
  saveData(); navigate('feed'); toast('Post published!');
}

// ── WEB SEARCH ───────────────────────────────────────────────
window._wsResults=[];
window._wsQuery='';
function renderWebSearch(){
  return `
  <div class="section-header"><div class="section-title">Web search</div></div>
  <div class="websearch-bar">
    <input class="websearch-input" id="ws-input" placeholder="Search the web..." value="${window._wsQuery}" onkeydown="if(event.key==='Enter')doWebSearch()" />
    <button class="websearch-btn" onclick="doWebSearch()">search</button>
  </div>
  <div id="ws-results">${window._wsResults.length ? renderWSResults(window._wsResults) : '<div class="empty-state">Enter a query and press search.</div>'}</div>`;
}
function renderWSResults(results){
  if(!results.length) return '<div class="empty-state">No results found.</div>';
  return results.map((r,i)=>`
  <div class="web-result-card">
    <div class="web-result-title" onclick="window.open('${r.url}','_blank')">${r.title}</div>
    <div class="web-result-url">${r.url}</div>
    <div class="web-result-snippet">${r.snippet}</div>
    <button class="web-result-save" onclick="saveSearchResult(${i})">+ save to blog</button>
  </div>`).join('');
}
function doWebSearch(){
  const q=document.getElementById('ws-input').value.trim();
  if(!q) return;
  window._wsQuery=q;
  const el=document.getElementById('ws-results');
  el.innerHTML='<div class="empty-state">Searching<span class="spinner"></span></div>';
  // Use DuckDuckGo instant answers API (CORS-friendly)
  const url=`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_redirect=1&no_html=1&skip_disambig=1`;
  fetch(url).then(r=>r.json()).then(data=>{
    const results=[];
    if(data.AbstractText) results.push({title:data.Heading||q,url:data.AbstractURL||'https://duckduckgo.com/?q='+encodeURIComponent(q),snippet:data.AbstractText});
    (data.RelatedTopics||[]).slice(0,8).forEach(t=>{
      if(t.Text&&t.FirstURL) results.push({title:t.Text.split(' - ')[0]||t.Text.substring(0,60),url:t.FirstURL,snippet:t.Text});
    });
    window._wsResults=results;
    el.innerHTML=results.length?renderWSResults(results):`<div class="empty-state">No instant results — <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}" target="_blank" style="color:var(--tag-search-txt)">open in DuckDuckGo</a></div>`;
  }).catch(()=>{
    window._wsResults=[];
    el.innerHTML=`<div class="empty-state">Search failed. <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}" target="_blank" style="color:var(--tag-search-txt)">Try DuckDuckGo directly</a></div>`;
  });
}
function saveSearchResult(i){
  const r=window._wsResults[i]; if(!r) return;
  DB.posts.unshift({
    id:Date.now(), type:'search',
    date:new Date().toISOString().split('T')[0],
    title:r.title, excerpt:r.snippet.substring(0,120)+'…',
    tags:['#search'], content:`<h3>Search result</h3>\n<p>${r.snippet}</p>\n<p><a href="${r.url}" target="_blank">${r.url}</a></p>`, comments:[]
  });
  saveData(); toast('Saved to blog!');
}

// ── NOTEPAD ──────────────────────────────────────────────────
window._notepadDraft = window._notepadDraft || '';
function renderNotepad(){
  return `
  <div class="notepad-wrap">
    <div class="section-header">
      <div class="section-title">Notepad</div>
      <div class="section-actions">
        <button class="note-save-btn" onclick="saveNote()">save note</button>
        <button class="note-clear-btn" onclick="clearNoteDraft()">clear</button>
      </div>
    </div>
    <textarea class="notepad-textarea" id="notepad-area" placeholder="Start typing... Auto-saved as you type." oninput="onNoteInput(this.value)">${window._notepadDraft}</textarea>
    <div class="notepad-status" id="note-status">0 words · 0 chars</div>
    <div class="saved-notes" id="saved-notes-list">${renderSavedNotes()}</div>
  </div>`;
}
function onNoteInput(v){
  window._notepadDraft=v; updateNoteCount();
}
function updateNoteCount(){
  const ta=document.getElementById('notepad-area');
  if(!ta) return;
  const v=ta.value;
  const words=v.trim()?v.trim().split(/\s+/).length:0;
  const el=document.getElementById('note-status');
  if(el) el.textContent=words+' words · '+v.length+' chars';
}
function saveNote(){
  const v=window._notepadDraft.trim();
  if(!v){toast('Nothing to save');return;}
  DB.notes.unshift({id:Date.now(),text:v,time:new Date().toISOString()});
  saveData(); window._notepadDraft='';
  const ta=document.getElementById('notepad-area');
  if(ta) ta.value='';
  document.getElementById('saved-notes-list').innerHTML=renderSavedNotes();
  toast('Note saved!');
}
function clearNoteDraft(){
  window._notepadDraft='';
  const ta=document.getElementById('notepad-area');
  if(ta){ta.value='';ta.focus();}
  updateNoteCount();
}
function renderSavedNotes(){
  if(!DB.notes.length) return '';
  return '<div style="font-size:11px;color:var(--muted);margin-bottom:.5rem;margin-top:1rem">saved notes</div>'+DB.notes.map(n=>`
  <div class="saved-note-item">
    <div class="saved-note-content" onclick="loadNote(${n.id})" title="Click to load">${n.text.substring(0,200)}${n.text.length>200?'…':''}</div>
    <span class="saved-note-time">${new Date(n.time).toLocaleDateString()}</span>
    <button class="note-del" onclick="deleteNote(${n.id})">✕</button>
  </div>`).join('');
}
function loadNote(id){
  const n=DB.notes.find(x=>x.id===id); if(!n) return;
  window._notepadDraft=n.text;
  const ta=document.getElementById('notepad-area');
  if(ta){ta.value=n.text;ta.focus();}
  updateNoteCount();
}
function deleteNote(id){
  DB.notes=DB.notes.filter(x=>x.id!==id);
  saveData(); document.getElementById('saved-notes-list').innerHTML=renderSavedNotes();
}

// ── CALCULATOR ───────────────────────────────────────────────
function renderCalc(){
  const btns=[
    ['AC','(',')','/'],['7','8','9','*'],['4','5','6','-'],['1','2','3','+'],['0','.','⌫','=']
  ];
  return `
  <div class="calc-wrap">
    <div class="section-title" style="margin-bottom:1rem">Calculator</div>
    <div class="calc-display">
      <div class="calc-expr" id="calc-expr">${calcExpr||''}</div>
      <div class="calc-result" id="calc-result">${calcDisplay}</div>
    </div>
    <div class="calc-grid">
      ${btns.map(row=>row.map(b=>`<button class="calc-btn${b==='='?' eq':''}${['/','+','-','*','(',')'].includes(b)?' op':''}${b==='AC'?' ac':''}" onclick="calcPress('${b}')">${b}</button>`).join('')).join('')}
    </div>
    <div class="calc-history" id="calc-hist">
      ${DB.calcHistory.slice(0,10).map(h=>`<div class="calc-history-item">${h}</div>`).join('')}
    </div>
  </div>`;
}
function calcPress(b){
  if(b==='AC'){calcExpr='';calcDisplay='0';}
  else if(b==='⌫'){calcExpr=calcExpr.slice(0,-1);calcDisplay=calcExpr||'0';}
  else if(b==='='){
    try{
      const res=Function('"use strict";return ('+calcExpr+')')();
      const r=Math.round(res*1e10)/1e10;
      DB.calcHistory.unshift(calcExpr+' = '+r);
      DB.calcHistory=DB.calcHistory.slice(0,20);
      saveData();
      calcDisplay=String(r); calcExpr='';
    }catch{calcDisplay='Error';calcExpr='';}
  } else {
    calcExpr+=b; calcDisplay=calcExpr;
  }
  const er=document.getElementById('calc-expr');
  const dr=document.getElementById('calc-result');
  const hr=document.getElementById('calc-hist');
  if(er) er.textContent=calcExpr;
  if(dr) dr.textContent=calcDisplay;
  if(hr) hr.innerHTML=DB.calcHistory.slice(0,10).map(h=>`<div class="calc-history-item">${h}</div>`).join('');
}

// ── WEATHER ──────────────────────────────────────────────────
window._weatherData=null;
window._lastWeatherCity='';
function renderWeather(){
  return `
  <div class="weather-wrap">
    <div class="section-title" style="margin-bottom:1rem">Weather</div>
    <div class="weather-search-row">
      <input class="weather-input" id="w-city" placeholder="Enter city name..." onkeydown="if(event.key==='Enter')fetchWeather(this.value,true)" value="${window._lastWeatherCity}" />
      <button class="weather-btn" onclick="fetchWeather(document.getElementById('w-city').value,true)">get weather</button>
    </div>
    <div id="weather-result">${window._weatherData?renderWeatherCard(window._weatherData):'<div class="empty-state">Enter a city to see the weather.</div>'}</div>
  </div>`;
}
function fetchWeather(city, save){
  city=city.trim(); if(!city) return;
  if(save) window._lastWeatherCity=city;
  document.getElementById('weather-result').innerHTML='<div class="empty-state">Loading<span class="spinner"></span></div>';
  fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`)
    .then(r=>r.json()).then(data=>{
      const c=data.current_condition[0];
      const area=data.nearest_area[0];
      const areaName=area.areaName[0].value+', '+(area.country[0].value);
      const w={city:city,area:areaName,temp:c.temp_C,feels:c.FeelsLikeC,desc:c.weatherDesc[0].value,humidity:c.humidity,wind:c.windspeedKmph,visibility:c.visibility};
      window._weatherData=w;
      document.getElementById('weather-result').innerHTML=renderWeatherCard(w);
    }).catch(()=>{
      document.getElementById('weather-result').innerHTML='<div class="empty-state">Could not fetch weather. Check city name or network.</div>';
    });
}
function renderWeatherCard(w){
  const emojis={'Sunny':'☀️','Clear':'🌙','Partly cloudy':'⛅','Cloudy':'☁️','Overcast':'☁️','Rain':'🌧️','Drizzle':'🌦️','Snow':'❄️','Thunder':'⛈️','Fog':'🌫️','Mist':'🌫️'};
  const icon=Object.keys(emojis).find(k=>w.desc.includes(k))||'🌡️';
  return `
  <div class="weather-card">
    <div class="weather-city">${icon} ${w.city}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:.75rem">${w.area}</div>
    <div class="weather-temp">${w.temp}°C</div>
    <div class="weather-desc">${w.desc}</div>
    <div class="weather-details">
      <div class="weather-detail"><span class="weather-detail-val">${w.feels}°C</span><span class="weather-detail-lbl">feels like</span></div>
      <div class="weather-detail"><span class="weather-detail-val">${w.humidity}%</span><span class="weather-detail-lbl">humidity</span></div>
      <div class="weather-detail"><span class="weather-detail-val">${w.wind} km/h</span><span class="weather-detail-lbl">wind</span></div>
    </div>
    <div class="weather-note">Visibility: ${w.visibility} km · Data via wttr.in</div>
  </div>`;
}

window._newsCategory='technology';
const NEWS_CATS=['technology','science','programming','linux','python','ai','design'];
const NEWS_FEEDS={
  technology:[{title:'Google announces new AI features in Search',source:'TechCrunch',time:'2h ago',url:'#'},{title:'Microsoft rolls out Copilot+ to more devices',source:'The Verge',time:'4h ago',url:'#'},{title:'New open-source LLM beats GPT-4 on benchmarks',source:'ArsTechnica',time:'6h ago',url:'#'},{title:'Docker introduces new dev environment tooling',source:'InfoQ',time:'8h ago',url:'#'}],
  science:[{title:'Webb telescope reveals new data on dark matter',source:'NASA',time:'3h ago',url:'#'},{title:'Researchers achieve new quantum computing milestone',source:'Nature',time:'5h ago',url:'#'},{title:'New study links sleep patterns to memory formation',source:'ScienceDaily',time:'7h ago',url:'#'}],
  programming:[{title:'TypeScript 5.5 released with new features',source:'devblogs.microsoft.com',time:'1h ago',url:'#'},{title:'The state of JavaScript 2025 survey results',source:'stateofjs.com',time:'3h ago',url:'#'},{title:'Why Rust is taking over systems programming',source:'dev.to',time:'5h ago',url:'#'}],
  linux:[{title:'Linux kernel 6.12 stable release notes',source:'kernel.org',time:'2h ago',url:'#'},{title:'Ubuntu 25.04 release candidate available',source:'OMGUbuntu',time:'6h ago',url:'#'},{title:'Systemd 256 brings new container features',source:'LWN.net',time:'9h ago',url:'#'}],
  python:[{title:'Python 3.14 alpha 3 release notes',source:'python.org',time:'4h ago',url:'#'},{title:'Ruff v0.5 massively speeds up linting',source:'astral.sh',time:'8h ago',url:'#'},{title:'FastAPI vs Django in 2025 — a comparison',source:'realpython.com',time:'10h ago',url:'#'}],
  ai:[{title:'Anthropic releases new model with extended context',source:'Anthropic',time:'1h ago',url:'#'},{title:'Open source models close the gap on GPT-4o',source:'HuggingFace',time:'3h ago',url:'#'},{title:'AI coding assistants reshape developer workflows',source:'GitHub Blog',time:'5h ago',url:'#'}],
  design:[{title:'Figma adds new AI-powered design assistant',source:'Figma Blog',time:'2h ago',url:'#'},{title:'CSS anchor positioning lands in all browsers',source:'web.dev',time:'5h ago',url:'#'},{title:'The minimalist web design trend continues in 2025',source:'Smashing Magazine',time:'7h ago',url:'#'}]
};
function renderNews(){
  const items=NEWS_FEEDS[window._newsCategory]||[];
  const saved=DB.savedNews||[];
  return `
  <div class="section-header"><div class="section-title">News</div></div>
  <div class="news-filter-row">${NEWS_CATS.map(c=>`<button class="tag-pill${window._newsCategory===c?' active':''}" onclick="setNewsCategory('${c}')">${c}</button>`).join('')}</div>
  ${items.map((n,i)=>`
  <div class="news-card" onclick="window.open('${n.url}','_blank')">
    <div class="news-source">${n.source}</div>
    <div class="news-title">${n.title}</div>
    <div class="news-time">${n.time}</div>
    <button class="news-save-btn" onclick="event.stopPropagation();saveNewsItem(${i})">+ save to blog</button>
  </div>`).join('')}
  ${saved.length?`<div style="font-size:11px;color:var(--muted);margin-top:1.5rem;margin-bottom:.75rem">saved news</div>`+saved.map((n,i)=>`<div class="news-card"><div class="news-source">${n.source}</div><div class="news-title">${n.title}</div><div class="news-time">${n.time}</div><button class="news-save-btn" onclick="removeSavedNews(${i})">remove</button></div>`).join(''):''}`;
}
function setNewsCategory(c){window._newsCategory=c;render();}
function saveNewsItem(i){
  const n=(NEWS_FEEDS[window._newsCategory]||[])[i]; if(!n) return;
  if(!DB.savedNews) DB.savedNews=[];
  if(DB.savedNews.some(x=>x.title===n.title)){toast('Already saved');return;}
  DB.savedNews.unshift(n); saveData(); toast('News saved!');
  DB.posts.unshift({id:Date.now(),type:'search',date:new Date().toISOString().split('T')[0],title:n.title,excerpt:'Saved from '+n.source,tags:['#news','#'+window._newsCategory],content:`<h3>Source</h3><p>${n.source} · ${n.time}</p><p>${n.title}</p>`,comments:[]});
  saveData();
}
function removeSavedNews(i){DB.savedNews.splice(i,1);saveData();render();}

// ── MESSAGES ─────────────────────────────────────────────────
function renderMsg(){
  if(!DB.userName){
    return `
    <div class="msg-wrap" style="max-width:480px">
      <div class="msg-header"><div class="msg-status"></div>himu.dev · messages</div>
      <div class="msg-name-setup">
        <div style="font-size:13px;color:var(--muted);margin-bottom:.25rem">What's your name?</div>
        <input class="msg-name-input" id="msg-name-in" placeholder="Enter your name..." onkeydown="if(event.key==='Enter')setMsgName()" />
        <button class="msg-name-btn" onclick="setMsgName()">join chat</button>
      </div>
    </div>`;
  }
  return `
  <div class="msg-wrap" style="max-width:560px">
    <div class="msg-header"><div class="msg-status"></div>himu.dev · chat <span style="font-size:10px;color:var(--muted);margin-left:auto">you are: ${DB.userName}</span></div>
    <div class="msg-list" id="msg-list">
      ${DB.messages.map(m=>`
      <div class="msg-item ${m.author===DB.userName?'me':'them'}">
        ${m.author!==DB.userName?`<div class="msg-author">${m.author}</div>`:''}
        <div class="msg-bubble">${m.text}</div>
        <div class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
      </div>`).join('')}
    </div>
    <div class="msg-input-row">
      <textarea class="msg-input" id="msg-in" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button class="msg-send" onclick="sendMsg()">send</button>
    </div>
  </div>`;
}
function setMsgName(){
  const n=document.getElementById('msg-name-in').value.trim(); if(!n) return;
  DB.userName=n; saveData(); render();
}
function sendMsg(){
  const el=document.getElementById('msg-in'); if(!el) return;
  const t=el.value.trim(); if(!t) return;
  DB.messages.push({id:Date.now(),author:DB.userName,text:t,time:new Date().toISOString(),me:true});
  saveData(); el.value='';
  const list=document.getElementById('msg-list');
  if(list){
    const m=DB.messages[DB.messages.length-1];
    const div=document.createElement('div');
    div.className='msg-item me';
    div.innerHTML=`<div class="msg-bubble">${m.text}</div><div class="msg-time">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
    list.appendChild(div);
    scrollMsgList();
  }
}
function scrollMsgList(){
  setTimeout(()=>{const l=document.getElementById('msg-list');if(l)l.scrollTop=l.scrollHeight;},50);
}

  const learns=DB.posts.filter(p=>p.type==='learn').length;
  const searches=DB.posts.filter(p=>p.type==='search').length;

    <div class="about-card">
      <div class="about-card-title">all tags</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:.25rem">${allT.length?allT.map(t=>`<button class="hashtag" onclick="setTag('${t}');navigate('feed')">${t}</button>`).join(''):'<span style="font-size:12px;color:var(--hint)">No tags yet</span>'}</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:.5rem">
        <button class="icon-btn" onclick="exportAllMD()">⬇ export all posts (.md)</button>
        <button class="icon-btn" onclick="exportJSON()">⬇ export data (.json)</button>
        <button class="icon-btn" style="color:#c0392b" onclick="clearAll()">✕ clear all data</button>
      </div>
    </div>
  </div>`;
}
function exportJSON(){
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2));
  a.download='himu-blog-data.json'; a.click(); toast('Data exported!');
}
function clearAll(){
  if(!confirm('Clear ALL data? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  DB=defaultData(); saveData(); navigate('feed'); toast('All data cleared.');
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();navigate('feed');setTimeout(()=>document.getElementById('feed-search')?.focus(),100);}
});
